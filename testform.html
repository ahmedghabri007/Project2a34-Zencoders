<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="form.css">
  <title>Test Form</title>
</head>
<body>
  <form action="/Elev8Talent/views/Back_Office/addprofile.php" method="POST">
    <h2>Add profile </h2><br><br>
    <label>Full Name:</label>
    <input type="text" name="fullname" ><br><br>

    <label>Age:</label>
    <input type="number" name="age" ><br><br>

    <label>Gender:</label>
    <select name="gender" >
      <option value="M">Male</option>
      <option value="F">Female</option>
    </select><br><br>

    <label>Location:</label>
    <input type="text" name="location"><br><br>

    <label>Profession:</label>
    <input type="text" name="profession"><br><br>

    <label>Interests:</label>
    <input type="text" name="interests"><br><br>

    <label>Biography:</label>
    <textarea name="biography"></textarea><br><br>

    <button type="submit">Send</button>
  </form>
</body>
<script src="form.js"></script>
</html>
